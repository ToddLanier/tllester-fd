<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
  <link rel="stylesheet" href="{{ "artistsafety/asn-style.css" | relURL }}?v=2">
  <style>
    html, body {
      background: #fff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      display: block;
      color: #404040;
      
    }
    /* Override base styles for ASN section */
    header, footer, main, nav {
      all: unset;
      display: block;
    }
    a, a:visited {
      color: #ed1c24;
      text-decoration: none;
    }
    a:hover {
      color: midnightblue;
    }
  </style>
</head>
<body>

  <!-- Global Search Drawer -->
  <div class="search-drawer" aria-expanded="false" role="region">
    <form role="search" method="get" class="searchform" action="{{ .Site.BaseURL }}search/">
      <input type="search" class="search-input" placeholder="Search …" value="" name="q">
    </form>
  </div>

  <div class="asn-site">


    {{/* Header */}}
    <header class="asn-header">
      <div class="asn-branding">
        <a href="{{ "artistsafety/" | relURL }}">
          <img src="{{ "artistsafety/images/asn-logo-wordmark.png" | relURL }}" alt="ArtistSafety.net">
        </a>
      </div>
    </header>

    {{/* Navigation */}}
    <nav class="asn-nav">
      <ul>
        <li><a href="{{ "artistsafety/about/" | relURL }}">about</a></li>
        <li><a href="{{ "artistsafety/archives/" | relURL }}">archives</a></li>
        <li><a href="{{ "artistsafety/training/" | relURL }}">training</a></li>
        <li><a href="{{ "artistsafety/research/" | relURL }}">research</a></li>
        <li><a href="{{ "artistsafety/documentation/" | relURL }}">documentation</a></li>
        <li><a href="{{ "artistsafety/case-management/" | relURL }}">case management</a></li>
      </ul>

      <!-- Search Toggle (top-right of navbar) -->
      <button class="search-toggle" aria-label="Toggle search">
        <svg class="icon-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </nav>

    {{/* Main Content */}}
    <main class="asn-main">
      {{ block "main" . }}{{ end }}
    </main>

    {{/* Footer */}}
    <footer class="asn-footer">
      <div class="asn-footer-copy">
        &copy;  ArtistSafety.net
      </div>
    </footer>

  </div>

  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
