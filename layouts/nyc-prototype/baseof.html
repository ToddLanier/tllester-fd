<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
  <link rel="stylesheet" href="{{ "nyc-prototype/nyc-style.css" | relURL }}">
  <style>
    html, body {
      background: #fff;
      font-family: "Times New Roman", Times, Georgia, serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      display: block;
      color: #363537;
    }
    /* Override base styles for NYC section */
    header, footer, main, nav {
      all: unset;
      display: block;
    }
    a, a:visited {
      color: #1da7e2;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Global Search Drawer -->
  <div class="search-drawer" aria-expanded="false" role="region">
    <form role="search" method="get" class="searchform" action="{{ .Site.BaseURL }}search/">
      <input type="search" class="search-input" placeholder="Search …" value="" name="q">
    </form>
  </div>

  <div class="nyc-site">

    {{/* Navbar — transparent on homepage, solid on inner pages */}}
    <div class="nyc-navbar {{ if .IsSection }}navbar-transparent{{ else }}navbar-solid{{ end }}">
      <div class="nyc-navbar-inner">
        <a href="{{ "nyc-prototype/" | relURL }}" class="nyc-navbar-brand">New York City Artist Safe Haven Prototype</a>
        <ul class="nyc-nav">
          <li><a href="{{ "nyc-prototype/about/" | relURL }}">About</a></li>
          <li><a href="{{ "nyc-prototype/artists/" | relURL }}">Artists</a></li>
        </ul>

        <!-- Search Toggle (top nav) -->
        <button class="search-toggle" aria-label="Toggle search">
          <svg class="icon-search" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    {{ block "main" . }}
    
    {{ end }}

    {{/* Footer */}}
    <div class="nyc-footer">
      <div class="nyc-footer-inner">
        <ul class="nyc-footer-menu">
          <li><a href="{{ "nyc-prototype/" | relURL }}">Home</a></li>
          <li><a href="{{ "nyc-prototype/artists/" | relURL }}">Artists</a></li>
        </ul>
        <div class="nyc-footer-copy">&copy; {{ now.Year }} NYC Artist Safe Haven Prototype</div>
      </div>
    </div>

  </div>

  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
