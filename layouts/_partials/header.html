  <a href="https://tllester.info/">&larr; back to tllester.info</a>

<div>
  <button class="search-toggle" aria-label="Toggle search">
    <svg class="icon-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

      data-theme-toggle
      aria-label="Change to light theme"
      class="theme-toggle theme-switch"
    >🌞</button>

<a class="title" href="{{ .Site.Home.RelPermalink }}" aria-label="Home">
